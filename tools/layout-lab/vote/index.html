<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votación A/B de layout</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --ink: #111827; --muted: #6b7280; --line: #d1d5db;
    --accent: #2563eb; --win: #16a34a; --tie: #d97706; --chip: #e5e7eb; --chip-on: #1d4ed8; --chip-on-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --ink: #e5e7eb; --muted: #9ca3af; --line: #374151; --chip: #1f2937; --chip-on: #3b82f6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  header, footer { display: flex; align-items: center; gap: 12px; padding: 8px 14px; flex-wrap: wrap; }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }
  .progress { flex: 1; min-width: 160px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .count { font-variant-numeric: tabular-nums; font-weight: 600; }
  .saved { color: var(--muted); min-width: 90px; text-align: right; }
  .saved.ok { color: var(--win); }
  #stage { position: relative; display: flex; gap: 12px; padding: 12px; min-height: 0; overflow: hidden; }
  #stage.stack { flex-direction: column; }
  #stage.zoom { overflow: auto; }
  .pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .pane .tag { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .pane .tag b { color: var(--ink); }
  .frame { flex: 1; min-height: 0; background: #fff; border: 3px solid transparent; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: border-color .15s; }
  #stage.zoom .frame { overflow: auto; align-items: flex-start; justify-content: flex-start; cursor: zoom-out; }
  .frame img { display: block; flex: none; image-rendering: auto; }
  .frame.chosen { border-color: var(--win); }
  .frame.tied { border-color: var(--tie); }
  .keys { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .keys button, .chip { border: 1px solid var(--line); background: var(--panel); color: #111827; border-radius: 6px;
    padding: 5px 10px; font: inherit; cursor: pointer; }
  .keys button:hover { border-color: var(--accent); }
  .keys button:disabled { opacity: .5; cursor: default; }
  kbd { font: 12px ui-monospace, monospace; background: var(--chip); color: var(--ink); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  .keys button kbd { background: #f3f4f6; color: #111827; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--chip); color: var(--ink); font-size: 12px; padding: 3px 8px; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  #note { flex: 1; min-width: 200px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: #111827; font: inherit; }
  .hint { color: var(--muted); font-size: 12px; }
  #overlay { position: fixed; inset: 0; background: rgba(15,17,21,.72); display: none; align-items: center; justify-content: center; z-index: 5; }
  #overlay.show { display: flex; }
  .card { background: var(--panel); color: #111827; border-radius: 12px; padding: 22px 26px; max-width: 560px; width: calc(100% - 32px);
    box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .card kbd { background: #f3f4f6; color: #111827; border-color: #d1d5db; }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .card table { border-collapse: collapse; width: 100%; margin: 8px 0 14px; }
  .card td { padding: 4px 6px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  .card .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .primary { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
  @media (max-width: 700px) { #stage { flex-direction: column; } .hint { display: none; } }
</style>
</head>
<body>
<header>
  <span class="count" id="count">–</span>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <span id="pairLabel" class="hint"></span>
  <span class="saved" id="saved" role="status" aria-live="polite"></span>
</header>

<main id="stage" aria-label="Pareja de diagramas">
  <section class="pane"><div class="tag"><span><b>Izquierda</b> <kbd>←</kbd></span><span id="leftSize"></span></div>
    <div class="frame" id="leftFrame"><img id="leftImg" alt="Diagrama izquierdo"></div></section>
  <section class="pane"><div class="tag"><span><b>Derecha</b> <kbd>→</kbd></span><span id="rightSize"></span></div>
    <div class="frame" id="rightFrame"><img id="rightImg" alt="Diagrama derecho"></div></section>
</main>

<footer>
  <div class="keys">
    <button data-choice="left"><kbd>←</kbd> Izquierda</button>
    <button data-choice="tie"><kbd>↓</kbd> Empate</button>
    <button data-choice="right">Derecha <kbd>→</kbd></button>
    <button id="prevBtn" title="Pareja anterior"><kbd>↑</kbd> Atrás</button>
    <button id="msgBtn" title="Ver u ocultar los flujos de mensaje en las dos imágenes"><kbd>M</kbd> <span id="msgLabel">Mensajes</span></button>
  </div>
  <div class="chips" id="chips" aria-label="Qué decidió el voto (opcional)"></div>
  <input id="note" placeholder="Nota opcional (N para escribir, Enter para volver)" maxlength="2000">
  <span class="hint"><kbd>V</kbd> disposición · <kbd>Z</kbd> zoom 1:1 · <kbd>?</kbd> ayuda</span>
</footer>

<div id="overlay" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let state = null, index = 0, layout = null, zoom = false, shownAt = 0;
  let tags = new Set();
  // Message-flow toggle: shows each side's alternative view (same layout, flows shown/hidden).
  // The choice carries over to the next pairs; sawAlt records whether this pair was seen that way.
  let altOn = false, sawAlt = false;

  const pairs = () => state.pairs;
  const current = () => pairs()[index];
  const hasAlt = p => !!(p.left.alt && p.right.alt);
  const altActive = p => altOn && hasAlt(p);
  const dims = (p, s) => (altActive(p) ? p[s].alt : p[s]);
  const imgUrl = (p, s, alt) => `/img/${p.pairId}/${s}${alt ? '/alt' : ''}`;
  const viewName = v => (v === 'shown' ? 'visibles' : 'ocultos');
  const votedCount = () => Object.keys(state.votes).length;
  const firstUnvoted = (from = 0) => {
    const n = pairs().length;
    for (let k = 0; k < n; k++) { const i = (from + k) % n; if (!state.votes[pairs()[i].pairId]) return i; }
    return -1;
  };

  function renderChips() {
    $('chips').innerHTML = '';
    state.rubric.forEach((r, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (tags.has(r.key) ? ' on' : '');
      b.innerHTML = `<kbd>${i + 1}</kbd> ${r.label}`;
      b.setAttribute('aria-pressed', tags.has(r.key));
      b.onclick = () => toggleTag(r.key);
      $('chips').appendChild(b);
    });
  }
  function toggleTag(key) { tags.has(key) ? tags.delete(key) : tags.add(key); renderChips(); }

  /** Same scale for both images; auto side-by-side or stacked, whichever shows them bigger. */
  function fit() {
    const p = current(); if (!p) return;
    const stage = $('stage');
    const W = stage.clientWidth - 24, H = stage.clientHeight - 24 - 22;
    const [l, r] = [dims(p, 'left'), dims(p, 'right')];
    const w = Math.max(l.width, r.width), h = Math.max(l.height, r.height);
    const side = Math.min((W - 12) / 2 / w, H / h), stack = Math.min(W / w, (H - 34) / 2 / h);
    const mode = layout ?? (stack > side ? 'stack' : 'side');
    stage.classList.toggle('stack', mode === 'stack');
    stage.classList.toggle('zoom', zoom);
    const scale = zoom ? 1 : Math.min(1.5, mode === 'stack' ? stack : side) * 0.98;
    for (const s of ['left', 'right']) {
      const img = $(s + 'Img'); const d = dims(p, s);
      img.style.width = `${Math.round(d.width * scale)}px`;
      img.style.height = `${Math.round(d.height * scale)}px`;
      $(s + 'Size').textContent = `${d.width}×${d.height}px · ${Math.round(scale * 100)} %`;
    }
  }

  function renderImages() {
    const p = current(); const alt = altActive(p);
    if (alt) sawAlt = true;
    for (const s of ['left', 'right']) $(s + 'Img').src = imgUrl(p, s, alt);
    const view = alt ? p.left.alt.view : state.view;
    $('msgLabel').textContent = hasAlt(p) ? `Mensajes: ${viewName(view)}` : 'Sin mensajes';
    $('msgBtn').disabled = !hasAlt(p);
    $('msgBtn').classList.toggle('primary', alt);
    fit();
  }

  function toggleMessages() {
    if (!hasAlt(current())) return;
    altOn = !altOn;
    renderImages();
  }

  function show(i) {
    index = Math.max(0, Math.min(pairs().length - 1, i));
    const p = current();
    const vote = state.votes[p.pairId];
    tags = new Set(vote?.tags ?? []);
    $('note').value = vote?.note ?? '';
    sawAlt = false;
    $('leftFrame').className = 'frame' + (vote?.choice === 'left' ? ' chosen' : vote?.choice === 'tie' ? ' tied' : '');
    $('rightFrame').className = 'frame' + (vote?.choice === 'right' ? ' chosen' : vote?.choice === 'tie' ? ' tied' : '');
    $('pairLabel').textContent = `Pareja ${index + 1} de ${pairs().length}` + (vote ? ' · ya votada (puedes cambiarla)' : '');
    renderChips(); progress(); renderImages();
    shownAt = performance.now();
    const next = pairs()[index + 1];
    if (next) for (const s of ['left', 'right']) new Image().src = imgUrl(next, s, altActive(next));
  }

  function progress() {
    $('count').textContent = `${votedCount()} / ${pairs().length}`;
    $('bar').style.width = `${100 * votedCount() / pairs().length}%`;
  }

  async function vote(choice) {
    const p = current(); if (!p) return;
    const body = { pairId: p.pairId, choice, tags: [...tags], note: $('note').value.trim(), ms: Math.round(performance.now() - shownAt), sawAltView: sawAlt };
    $('saved').className = 'saved'; $('saved').textContent = 'guardando…';
    try {
      const res = await fetch('/api/vote', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error((await res.json()).error);
    } catch (err) {
      $('saved').textContent = 'error al guardar: ' + err.message; return;
    }
    state.votes[p.pairId] = { choice, tags: body.tags, note: body.note };
    $('saved').className = 'saved ok'; $('saved').textContent = 'guardado ✓';
    $(choice === 'right' ? 'rightFrame' : 'leftFrame').classList.add(choice === 'tie' ? 'tied' : 'chosen');
    if (choice === 'tie') $('rightFrame').classList.add('tied');
    progress();
    setTimeout(() => {
      // Next unvoted pair; once all are voted (revising), simply the next pair, and the
      // "complete" dialog only after the last one, so a revision never traps the page.
      const next = firstUnvoted(index + 1);
      if (next !== -1) show(next);
      else if (votedCount() === pairs().length && index + 1 < pairs().length) show(index + 1);
      else finished();
    }, 180);
  }

  function dialog(html) { $('card').innerHTML = html; $('overlay').classList.add('show'); }
  function closeDialog() { $('overlay').classList.remove('show'); }

  function finished() {
    dialog(`<h2>Lote completo: ${votedCount()} / ${pairs().length}</h2>
      <p>Todos los votos están guardados. Puedes revisar cualquier pareja con <kbd>↑</kbd> o terminar.</p>
      <div class="actions"><button class="chip" id="review">Revisar</button>
      <button class="chip primary" id="quit">Terminar y cerrar</button></div>`);
    $('review').onclick = closeDialog;
    $('quit').onclick = async () => {
      await fetch('/api/quit', { method: 'POST' }).catch(() => {});
      dialog('<h2>Listo</h2><p>Servidor cerrado. Ya puedes cerrar esta pestaña.</p>');
    };
  }

  function help() {
    dialog(`<h2>Cómo votar</h2>
      <p>Mismo proceso dibujado con dos layouts. El orden es aleatorio y ciego. Elige el diagrama que se entiende mejor en conjunto.</p>
      <table>
        <tr><td><kbd>←</kbd> / <kbd>→</kbd></td><td>Gana el de la izquierda / derecha</td></tr>
        <tr><td><kbd>↓</kbd> o <kbd>E</kbd></td><td>Empate (ninguno es claramente mejor)</td></tr>
        <tr><td><kbd>1</kbd>–<kbd>6</kbd></td><td>Opcional, antes de votar: qué criterio decidió</td></tr>
        <tr><td><kbd>N</kbd></td><td>Escribir una nota (<kbd>Enter</kbd> vuelve a los atajos)</td></tr>
        <tr><td><kbd>↑</kbd> / <kbd>Retroceso</kbd> · <kbd>S</kbd></td><td>Pareja anterior / siguiente sin votar (para cambiar un voto). <code>#p04</code> en la URL abre esa pareja</td></tr>
        <tr><td><kbd>V</kbd> · <kbd>Z</kbd></td><td>Lado a lado / apilados · Zoom 1:1 (también clic en una imagen)</td></tr>
        <tr><td><kbd>M</kbd></td><td>Ver / ocultar los flujos de mensaje en las dos imágenes (se mantiene en las parejas siguientes)</td></tr>
      </table>
      <p class="hint">Cada voto se guarda al instante; puedes cerrar y reanudar el lote cuando quieras.</p>
      <div class="actions"><button class="chip primary" id="ok">Empezar <kbd>Enter</kbd></button></div>`);
    $('ok').onclick = closeDialog;
  }

  document.addEventListener('keydown', e => {
    if ($('overlay').classList.contains('show')) {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); closeDialog(); }
      return;
    }
    if (document.activeElement === $('note')) {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); $('note').blur(); }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const actions = {
      arrowleft: () => vote('left'), arrowright: () => vote('right'), arrowdown: () => vote('tie'), e: () => vote('tie'),
      arrowup: () => show(index - 1), backspace: () => show(index - 1), s: () => show(index + 1),
      n: () => $('note').focus(), v: () => { layout = $('stage').classList.contains('stack') ? 'side' : 'stack'; fit(); },
      z: () => { zoom = !zoom; fit(); }, m: toggleMessages, '?': help, h: help,
    };
    if (/^[1-9]$/.test(k) && state.rubric[+k - 1]) { e.preventDefault(); toggleTag(state.rubric[+k - 1].key); return; }
    if (actions[k]) { e.preventDefault(); actions[k](); }
  });
  document.querySelectorAll('[data-choice]').forEach(b => { b.onclick = () => vote(b.dataset.choice); });
  $('prevBtn').onclick = () => show(index - 1);
  $('msgBtn').onclick = toggleMessages;
  for (const s of ['leftFrame', 'rightFrame']) $(s).onclick = () => { zoom = !zoom; fit(); };
  window.addEventListener('resize', fit);

  fetch('/api/state').then(r => r.json()).then(s => {
    state = s;
    if (!pairs().length) { dialog('<h2>Lote vacío</h2><p>No hay parejas que votar.</p>'); return; }
    const start = firstUnvoted(0);
    const linked = pairs().findIndex(p => `#${p.pairId}` === location.hash);
    show(linked !== -1 ? linked : start === -1 ? 0 : start);
    if (linked !== -1) return;
    if (start === -1) finished(); else if (votedCount() === 0) help();
  });
})();
</script>
</body>
</html>
